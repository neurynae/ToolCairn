name: Publish to npm

on:
  push:
    tags:
      - 'v*'   # triggers on v0.1.0, v1.0.0, etc.

jobs:
  publish:
    name: Publish @neurynae/toolcairn-mcp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @toolpilot/db run db:generate

      - name: Build mcp package and dependencies
        run: |
          pnpm --filter @toolpilot/config build
          pnpm --filter @toolpilot/core build
          pnpm --filter @toolpilot/db build
          pnpm --filter @toolpilot/vector build
          pnpm --filter @toolpilot/graph build
          pnpm --filter @toolpilot/queue build
          pnpm --filter @toolpilot/search build
          pnpm --filter @toolpilot/tools build
          pnpm --filter @toolpilot/remote build
          pnpm --filter @neurynae/toolcairn-mcp build

      - name: Publish @neurynae/toolcairn-mcp
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          pnpm --filter @neurynae/toolcairn-mcp publish --access public --no-git-checks
